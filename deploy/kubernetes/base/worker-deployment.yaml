apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-space-worker
  namespace: agent-space
  labels:
    app.kubernetes.io/name: agent-space-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: agent-space
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-space-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-space-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: agent-space
    spec:
      serviceAccountName: agent-space-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: agentspace/backend:0.1.0
          command: ["/bin/sh", "-ec"]
          args: ["until alembic current --check-heads; do sleep 5; done"]
          envFrom:
            - configMapRef:
                name: agent-space-config
            - secretRef:
                name: agent-space-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: agentspace/worker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-space-config
            - secretRef:
                name: agent-space-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /app/var/workspaces
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspaces
          persistentVolumeClaim:
            claimName: agent-space-workspaces
