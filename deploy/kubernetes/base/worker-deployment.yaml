apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-space-worker
  namespace: agent-space
  labels:
    app.kubernetes.io/name: agent-space-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: agent-space
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-space-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-space-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: agent-space
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: agentspace/worker:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-space-config
            - secretRef:
                name: agent-space-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import sys; sys.exit(0)
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
