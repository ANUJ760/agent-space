apiVersion: v1
kind: Service
metadata:
  name: agent-space-temporal
  namespace: agent-space
spec:
  selector:
    app.kubernetes.io/name: agent-space-temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-space-temporal-dynamic-config
  namespace: agent-space
data:
  development-sql.yaml: "{}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-space-temporal-schema
  namespace: agent-space
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-space-temporal-schema
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: temporalio/admin-tools:1.28.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal create || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal setup-schema -v 0.0 || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal_visibility create || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal_visibility setup-schema -v 0.0 || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
          env:
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: agent-space-secrets, key: DB_PORT}}
            - name: POSTGRES_SEEDS
              valueFrom: {secretKeyRef: {name: agent-space-secrets, key: DB_HOST}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: agent-space-secrets, key: DB_USER}}
            - name: SQL_PASSWORD
              valueFrom: {secretKeyRef: {name: agent-space-secrets, key: DB_PASSWORD}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-space-temporal
  namespace: agent-space
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-space-temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-space-temporal
        app.kubernetes.io/component: orchestration
    spec:
      containers:
        - name: temporal
          image: temporalio/server:1.28.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: agent-space-secrets
                  key: DB_PORT
            - name: POSTGRES_SEEDS
              valueFrom:
                secretKeyRef:
                  name: agent-space-secrets
                  key: DB_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-space-secrets
                  key: DB_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: agent-space-secrets
                  key: DB_PASSWORD
            - name: BIND_ON_IP
              value: 0.0.0.0
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: config/dynamicconfig/development-sql.yaml
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
      volumes:
        - name: dynamic-config
          configMap:
            name: agent-space-temporal-dynamic-config
