metadata:
  name: agent-space-registry-secret
  namespace: agent-space
  labels:
    app.kubernetes.io/name: agent-space
    app.kubernetes.io/component: security
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"bWFuYWdlZC1ieS1zZWNyZXQtc3RvcmU="}}}'
