apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-space-ingress
  namespace: agent-space
  labels:
    app.kubernetes.io/name: agent-space-ingress
    app.kubernetes.io/part-of: agent-space
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - agentspace.internal
      secretName: agent-space-tls
  rules:
    - host: agentspace.internal
      http:
        paths:
          # Route API traffic to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-space-backend
                port:
                  number: 8000
          # Route WebSocket traffic to backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agent-space-backend
                port:
                  number: 8000
          - path: /collab
            pathType: Prefix
            backend:
              service:
                name: agent-space-collab
                port:
                  number: 1234
          # Route frontend SPA/SSR traffic to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-space-frontend
                port:
                  number: 3000
