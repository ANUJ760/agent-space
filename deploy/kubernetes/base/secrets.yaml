# ==============================================================================
# Agent Space - Secret References Template (No raw secrets baked in)
# ==============================================================================
# In production, this resource is populated by ExternalSecrets, SealedSecrets,
# HashiCorp Vault, AWS Secrets Manager, or Azure Key Vault CSI driver.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agent-space-secrets
  namespace: agent-space
  labels:
    app.kubernetes.io/name: agent-space
    app.kubernetes.io/part-of: agent-space
type: Opaque
stringData:
  # Secret references configured via runtime injection
  DATABASE_URL: "postgresql+asyncpg://appuser:${DB_PASSWORD}@postgres.agent-space.svc.cluster.local:5432/agentspace"
  KEYCLOAK_CLIENT_SECRET: "managed-by-secret-store"
  REDIS_PASSWORD: "managed-by-secret-store"
  NATS_AUTH_TOKEN: "managed-by-secret-store"
  OPENAI_API_KEY: "managed-by-secret-store"
  ANTHROPIC_API_KEY: "managed-by-secret-store"
