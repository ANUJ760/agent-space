apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-space-config
  namespace: agent-space
  labels:
    app.kubernetes.io/name: agent-space
    app.kubernetes.io/part-of: agent-space
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_FORMAT: "json"
  PORT: "8000"
  FRONTEND_PORT: "3000"
  NATS_URL: "nats://agent-space-nats.agent-space.svc.cluster.local:4222"
  TEMPORAL_HOST: "agent-space-temporal.agent-space.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "agent-space-tasks"
  TEMPORAL_TLS: "false"
  WORKSPACE_ROOT: "/app/var/workspaces"
  COLLAB_API_URL: "http://agent-space-backend.agent-space.svc.cluster.local:8000"
  COLLAB_PORT: "1234"
  PROMETHEUS_METRICS_ENABLED: "true"
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_COLLAB_URL: "/collab"
