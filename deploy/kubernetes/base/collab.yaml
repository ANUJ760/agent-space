apiVersion: v1
kind: Service
metadata:
  name: agent-space-collab
  namespace: agent-space
spec:
  selector:
    app.kubernetes.io/name: agent-space-collab
  ports:
    - name: websocket
      port: 1234
      targetPort: websocket
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-space-collab
  namespace: agent-space
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-space-collab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-space-collab
        app.kubernetes.io/component: collaboration
    spec:
      serviceAccountName: agent-space-collab
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collab
          image: agentspace/collab:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-space-config
          ports:
            - name: websocket
              containerPort: 1234
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: workspaces
              mountPath: /app/var/workspaces
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: agent-space-workspaces
        - name: tmp
          emptyDir: {}
