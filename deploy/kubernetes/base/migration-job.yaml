apiVersion: batch/v1
kind: Job
metadata:
  name: agent-space-migrate
  namespace: agent-space
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-space-migrate
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: agentspace/backend:0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: agent-space-config
            - secretRef:
                name: agent-space-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
