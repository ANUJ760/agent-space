server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: agentspace-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: agentspace-backend
          __path__: /var/log/agentspace/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            logger: logger
            request_id: request_id
      - labels:
          level:
          logger:
          event:
