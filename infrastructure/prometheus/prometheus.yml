# ==============================================================================
# Agent Space - Prometheus Server Configuration (M86)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # AgentSpace Backend API & Workers
  - job_name: "agentspace-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "agentspace"
          tier: "backend"

  # OpenTelemetry Collector Metrics Exporter
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          app: "agentspace"
          tier: "telemetry"

  # PostgreSQL Database Exporter
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis Cache Exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Node Exporter (Host & Disk Metrics)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
