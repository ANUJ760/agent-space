services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: agentspace/backend:0.1.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - WORKSPACE_ROOT=/app/var/workspaces
      - GIT_ALLOWED_HOSTS=${GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY for production}
      - CORS_ORIGINS=${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL for production}
      - DATABASE_URL=postgresql+asyncpg://agentspace:${DB_PASSWORD:?Set DB_PASSWORD for production}@postgres:5432/agentspace
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_GEMINI_API_KEY=${DEFAULT_GEMINI_API_KEY:-}
      - DEFAULT_AGENT_MODEL=${DEFAULT_AGENT_MODEL:-gemini-2.5-flash}
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
    volumes:
      - ${WORKSPACE_HOST_PATH:-./var/workspaces}:/app/var/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: agentspace/worker:0.1.0
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY for production}
      - DATABASE_URL=postgresql+asyncpg://agentspace:${DB_PASSWORD:?Set DB_PASSWORD for production}@postgres:5432/agentspace
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_COLLAB_URL: ${PUBLIC_COLLAB_URL:-ws://localhost:1234}
    image: agentspace/frontend:0.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_COLLAB_URL=${PUBLIC_COLLAB_URL:-ws://localhost:1234}
    depends_on:
      - backend
      - collab
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode < 500) process.exit(0); else process.exit(1);})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    image: agentspace/collab:0.1.0
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - WORKSPACE_ROOT=/app/var/workspaces
      - COLLAB_API_URL=http://backend:8000
      - COLLAB_PORT=1234
    volumes:
      - ${WORKSPACE_HOST_PATH:-./var/workspaces}:/app/var/workspaces
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentspace
      POSTGRES_USER: agentspace
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
